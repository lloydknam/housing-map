<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클사무관의 주택공급 지도</title>
<meta name="description" content="국토교통부 월간 주택통계를 시도별 지도 위에 보여주는 인허가·착공·준공·미분양 대시보드. 최근 20년 연도별 추이 포함">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f8ff; --panel: #ffffff; --ink: #0e1a2b; --ink2: #3a4a63; --muted: #6a7890; --line: #e3ebf7;
    --accent: #2f6bff; --accent-text: #1f55f0; --neg: #ff6b3d; --neg-text: #d9480f; --empty: #e8eef8;
    --bar-top: #c3d8ff; --bar: #8fb4ff; --bar-hi: #1f55f0; --bar-hi2: #5b8cff;
    --up-bg: #e5edff; --down-bg: #ffe9de; --grid: #edf2fa; --seg: #e8effb;
    --seq0: #e6efff; --seq1: #b5d0ff; --seq2: #6ea0ff; --seq3: #2f6bff; --seq4: #1a3fc4;
    --shadow: 0 1px 2px rgba(31,85,240,.05), 0 14px 40px -14px rgba(47,107,255,.28);
    --sky: #dcecff; --mint: #dff8ee; --sun: #fff1c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1424; --panel: #121e33; --ink: #eef3fb; --ink2: #b9c6dc; --muted: #8b9bb5; --line: #22324d;
      --accent: #5b8cff; --accent-text: #8fb4ff; --neg: #ff8a57; --neg-text: #ffa57d; --empty: #1c2b45;
      --bar-top: #4a7de0; --bar: #2f5fc4; --bar-hi: #8fb4ff; --bar-hi2: #c3d8ff;
      --up-bg: #1a3563; --down-bg: #55301a; --grid: #1d2c46; --seg: #1a2942;
      --seq0: #1b3a6b; --seq1: #25509e; --seq2: #3374e6; --seq3: #6c9dff; --seq4: #c3d8ff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 40px -14px rgba(0,0,0,.6);
      --sky: #11284a; --mint: #0f2e33; --sun: #3a3016;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
    line-height: 1.55; -webkit-font-smoothing: antialiased; letter-spacing: -0.012em;
    background:
      radial-gradient(900px 420px at 8% -80px, var(--sky), transparent 70%),
      radial-gradient(700px 380px at 96% -60px, var(--mint), transparent 70%),
      radial-gradient(520px 260px at 62% -120px, var(--sun), transparent 70%),
      var(--bg);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 44px 20px 48px; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; flex: none; border: 4px solid var(--panel);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), var(--shadow); }
  .hero { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 24px; margin-bottom: 26px; }
  h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.12; margin: 0; font-weight: 800; letter-spacing: -0.035em; }
  h2 { font-size: 22px; margin: 0; letter-spacing: -0.025em; font-weight: 800; }
  h3 { font-size: 15px; margin: 28px 0 12px; color: var(--ink2); font-weight: 600; }
  .sub { color: var(--ink2); font-size: 16px; margin: 10px 0 0; max-width: 560px; }
  .source-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--panel);
    box-shadow: var(--shadow); font-size: 13px; color: var(--ink2); font-weight: 500; }
  .source-pill i { width: 8px; height: 8px; border-radius: 50%; background: #1fd39a; box-shadow: 0 0 0 4px color-mix(in srgb, #1fd39a 22%, transparent); }

  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-bottom: 14px; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; }
  .group.seg { gap: 2px; padding: 4px; background: var(--seg); border-radius: 999px; flex-wrap: nowrap; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    border: 0; background: var(--panel); color: var(--ink2); box-shadow: var(--shadow); transition: background .15s, color .15s, box-shadow .15s; white-space: nowrap; }
  .btn:hover { color: var(--ink); }
  .btn[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
  .seg .btn { background: transparent; box-shadow: none; padding: 7px 14px; }
  .seg .btn[aria-pressed="true"] { background: var(--panel); color: var(--accent-text); box-shadow: 0 2px 8px rgba(14,26,43,.12); }
  #metrics .btn { padding: 11px 18px; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; }
  #metrics .btn .em { font-size: 17px; line-height: 1; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .btn:focus-visible, input[type=range]:focus-visible, .mini:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

  .timebar { display: flex; align-items: center; gap: 16px; margin: 18px 0 22px; background: var(--panel);
    box-shadow: var(--shadow); border-radius: 22px; padding: 12px 22px 12px 14px; }
  #play { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 15px; flex: none;
    background: var(--accent); color: #fff; box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--accent) 75%, transparent); }
  #play:hover { color: #fff; filter: brightness(1.08); }
  .timebar input { flex: 1; -webkit-appearance: none; appearance: none; height: 10px; border-radius: 999px; outline-offset: 6px;
    background: linear-gradient(90deg, var(--accent) var(--p, 100%), var(--seg) var(--p, 100%)); }
  .timebar input::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    border: 6px solid var(--accent); box-shadow: 0 4px 12px rgba(14,26,43,.25); cursor: grab; }
  .timebar input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 6px solid var(--accent); box-shadow: 0 4px 12px rgba(14,26,43,.25); cursor: grab; }
  .month { font-weight: 800; font-size: 20px; min-width: 128px; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); }
  #mapbox { position: relative; display: flex; flex-direction: column; padding: 10px; overflow: hidden; background:
      radial-gradient(420px 320px at 30% 20%, color-mix(in srgb, var(--sky) 90%, transparent), transparent 75%),
      radial-gradient(360px 300px at 90% 90%, color-mix(in srgb, var(--mint) 80%, transparent), transparent 75%),
      var(--panel); }
  svg#map { width: 100%; height: auto; display: block; flex: 1; min-height: 0; }
  .region { stroke: var(--panel); stroke-width: 1.6; stroke-linejoin: round; cursor: pointer; transition: fill .45s ease, stroke .15s; }
  .region:hover, .region.hl { stroke: var(--ink); stroke-width: 2.2; }
  .region.sel { stroke: var(--ink); stroke-width: 3; }
  .lbl { font-size: 14.5px; font-weight: 700; pointer-events: none; text-anchor: middle; fill: var(--ink); paint-order: stroke;
    stroke: color-mix(in srgb, var(--panel) 85%, transparent); stroke-width: 4px; stroke-linejoin: round; }
  .lbl.v { font-weight: 800; font-size: 16px; }
  .legend { position: absolute; right: 18px; bottom: 16px; max-width: calc(100% - 36px); justify-content: flex-end; background: color-mix(in srgb, var(--panel) 82%, transparent); padding: 6px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .legend .sw { width: 34px; height: 12px; border-radius: 4px; }
  .legend .grad { width: 180px; height: 12px; border-radius: 6px; }
  .empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 24px; font-size: 15px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); border-radius: 28px; }
  .empty.on { display: flex; }

  .sum .lab { font-size: 14px; color: var(--ink2); font-weight: 600; }
  .sum .big { font-size: clamp(44px, 7vw, 68px); line-height: 1.05; font-weight: 800; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; margin-top: 6px; color: var(--ink); }
  .sum .big small { font-size: 20px; font-weight: 700; color: var(--muted); margin-left: 6px; letter-spacing: -0.02em; }
  .sum .yoy { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
  .sum .yoy:empty { display: none; }
  .yoy.up { background: var(--up-bg); color: var(--accent-text); } .yoy.down { background: var(--down-bg); color: var(--neg-text); }
  .up { color: var(--accent-text); } .down { color: var(--neg-text); }
  #spark { width: 100%; height: 74px; margin-top: 14px; }
  .rank { list-style: none; margin: 14px 0 0; padding: 0; }
  .rank li { display: grid; grid-template-columns: 58px 1fr 84px; align-items: center; gap: 10px; padding: 5px 8px;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .12s; }
  .rank li:hover, .rank li.hl { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .rank .bar { height: 12px; border-radius: 6px; background: var(--seg); position: relative; overflow: hidden; }
  .rank .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: linear-gradient(90deg, var(--bar-hi2), var(--bar-hi)); transition: width .45s ease; }
  .rank .bar i.neg { background: linear-gradient(90deg, #ffa27d, var(--neg)); }
  .rank .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  #tip { position: fixed; pointer-events: none; display: none; z-index: 10; background: var(--ink); color: var(--panel);
    padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; max-width: 240px; box-shadow: 0 12px 30px rgba(14,26,43,.3); }
  #tip b { display: block; font-size: 15px; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 16px; line-height: 1.6; }

  .trend { margin-top: 22px; }
  .trend-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .trend-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  #bars { width: 100%; height: auto; display: block; }
  #bars .tx { font-size: 12px; fill: var(--muted); text-anchor: middle; font-weight: 500; }
  #bars .tv { font-size: 12px; font-weight: 800; fill: var(--ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
  #bars .tg { font-size: 12px; font-weight: 800; text-anchor: middle; }
  #bars .tg.up { fill: var(--accent-text); } #bars .tg.down { fill: var(--neg-text); } #bars .tg.na { fill: var(--muted); font-weight: 500; }
  #bars .gl { stroke: var(--grid); stroke-width: 1; }
  #bars .gt { font-size: 11px; fill: var(--muted); text-anchor: end; }
  #bars .chip.up { fill: var(--up-bg); } #bars .chip.down { fill: var(--down-bg); }
  #bars rect.bar { cursor: pointer; transition: filter .15s; } #bars rect.bar:hover { filter: brightness(1.07) saturate(1.1); }
  #multiples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 860px) { #multiples { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mini { border: 0; border-radius: 18px; padding: 12px 14px 10px; cursor: pointer; background: var(--bg); text-align: left; font: inherit; color: inherit;
    transition: transform .15s, box-shadow .15s, background .15s; }
  .mini:hover { background: color-mix(in srgb, var(--accent) 9%, var(--bg)); transform: translateY(-2px); }
  .mini.sel { background: var(--panel); box-shadow: 0 0 0 2.5px var(--accent), var(--shadow); }
  .mini .n { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .mini .n span.g { font-size: 12px; font-weight: 800; }
  .mini .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .mini svg { width: 100%; height: 46px; display: block; margin-top: 6px; }

  /* 로고 SVG는 밝은 배경용(남색 글자)이라 다크 모드에서도 읽히도록 크림색 칩 위에 올린다 */
  footer { margin-top: 36px; padding-top: 20px; display: flex; flex-wrap: wrap;
    align-items: flex-end; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); }
  .lockup { display: inline-block; background: #fff8e8; border-radius: 16px; padding: 7px 14px; line-height: 0; box-shadow: var(--shadow); }
  .lockup img { display: block; height: 48px; width: auto; }
  .brand-note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  footer a { color: inherit; }
  @media (max-width: 560px) { .brand img { width: 60px; height: 60px; } .brand { gap: 12px; } .wrap { padding: 28px 14px 36px; } .card { padding: 16px; border-radius: 22px; } .month { min-width: 96px; font-size: 17px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <img src="assets/clerk.jpg?v=2" alt="클사무관" width="88" height="88">
      <div>
      <h1>클사무관의 주택공급 지도</h1>
      <p class="sub">인허가부터 미분양까지, 시도별 주택 통계를 지도와 20년 추이로 한눈에 봅니다.</p>
      </div>
    </div>
    <span class="source-pill"><i></i>국토교통부 월간 주택통계 · KOSIS</span>
  </header>

  <div class="controls">
    <div class="group" id="metrics" role="group" aria-label="지표 선택"></div>
    <div class="group seg" id="units" role="group" aria-label="시간 단위">
      <button class="btn" data-unit="month" aria-pressed="true">월별</button>
      <button class="btn" data-unit="year" aria-pressed="false">연도별</button>
    </div>
    <div class="group seg" id="modes" role="group" aria-label="보기 방식">
      <button class="btn" data-mode="level" aria-pressed="true">월 수치</button>
      <button class="btn" data-mode="cum" aria-pressed="false">연초 누계</button>
      <button class="btn" data-mode="yoy" aria-pressed="false">전년 동월 대비</button>
    </div>
  </div>

  <div class="timebar">
    <button class="btn" id="play" aria-label="재생">▶</button>
    <input type="range" id="slider" min="0" max="0" value="0" aria-label="기간 선택">
    <span class="month" id="monthLabel">–</span>
  </div>

  <div class="grid">
    <div class="card" id="mapbox">
      <svg id="map" viewBox="0 0 600 760" role="img" aria-label="시도별 주택통계 지도"></svg>
      <div class="legend" id="legend"></div>
      <div class="empty" id="empty">아직 수집된 데이터가 없습니다.<br>KOSIS 수집 설정이 끝나면 이 지도가 채워집니다.</div>
    </div>
    <div class="card">
      <div class="sum">
        <div class="lab" id="sumLab">전국</div>
        <div class="big" id="sumBig">–</div>
        <div class="yoy" id="sumYoy"></div>
        <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
      <ul class="rank" id="rank"></ul>
      <div class="note" id="note"></div>
    </div>
  </div>

  <section class="card trend" id="trend">
    <div class="trend-head">
      <div>
        <h2 id="trendTitle">연도별 추이</h2>
        <div class="trend-sub" id="trendSub"></div>
      </div>
      <div class="group seg" id="basis" role="group" aria-label="집계 기준">
        <button class="btn" data-basis="full" aria-pressed="true">연간</button>
        <button class="btn" data-basis="ytd" aria-pressed="false">동기간 비교</button>
      </div>
    </div>
    <svg id="bars" viewBox="0 0 700 260" role="img" aria-label="연도별 막대 그래프"></svg>
    <h3>시도별 한눈에 (막대를 누르면 해당 연도로 지도가 바뀝니다)</h3>
    <div id="multiples"></div>
    <div class="note" id="trendNote"></div>
  </section>

  <footer>
    <div class="credit">
      <a class="lockup" href="https://github.com/lloydknam" target="_blank" rel="noopener"><img src="assets/brand/lockup-light.svg" alt="Lloyd's Balcony Lab · with claude · GitHub(@lloydknam)" height="48"></a>
      <div class="brand-note">*아직 실험 중</div>
    </div>
    <div id="srcLine"></div>
  </footer>
</div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  // 광주·전남은 2026년 중반부터 '전남광주'로 합쳐서 공표된다 → 데이터 코드 2436 하나로 다루고 지도에서도 한 덩어리로 칠한다.
  const NAMES = {'11':'서울','21':'부산','22':'대구','23':'인천','25':'대전','26':'울산','29':'세종',
    '31':'경기','32':'강원','33':'충북','34':'충남','35':'전북','37':'경북','38':'경남','39':'제주','2436':'전남광주'};
  const CODES = Object.keys(NAMES);
  const GROUP = { '24': '2436', '36': '2436' };
  const gcode = (f) => GROUP[f.properties.code] || f.properties.code;
  const EMOJI = { permit: '📝', start: '🏗️', sale: '📣', complete: '🏠', unsold: '🪧', unsold_post: '🧱' };
  const SHOWN_YEARS = 21; // 최근 20개 연도 + 올해(일부만 집계된 경우 포함)

  const state = { metric: null, mode: 'level', unit: 'month', basis: 'full', idx: 0, selected: null, playing: false };
  let META, DATA, GEO, MONTHS = [], YEARS = [], timer = null, TOT = null;

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n == null ? '–' : Math.round(n).toLocaleString('ko-KR');
  const fmtShort = (n) => n == null ? '' : (Math.abs(n) >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '만' : fmt(n));
  const fmtPct = (n) => n == null ? '–' : (n > 0 ? '+' : '') + (Math.abs(n) >= 1000 ? Math.round(n).toLocaleString('ko-KR') : n.toFixed(1)) + '%';
  const monthText = (m) => m ? m.slice(0, 4) + '년 ' + parseInt(m.slice(5), 10) + '월' : '–';
  const metricDef = () => META.metrics.find((m) => m.id === state.metric);
  const isStock = () => metricDef().kind === 'stock';
  const series = (code) => (DATA[state.metric] && DATA[state.metric][code]) || {};
  const pad2 = (n) => String(n).padStart(2, '0');
  const periods = () => state.unit === 'year' ? YEARS : MONTHS;
  const lastMonth = () => MONTHS[MONTHS.length - 1];
  const latestYear = () => parseInt(lastMonth().slice(0, 4), 10);
  const latestN = () => parseInt(lastMonth().slice(5), 10);

  function buildPeriods() {
    const set = new Set();
    const d = DATA[state.metric] || {};
    CODES.forEach((c) => Object.keys(d[c] || {}).forEach((m) => set.add(m)));
    MONTHS = Array.from(set).sort();
    // 1월부터 데이터가 있는 해만 연도별로 쓴다(수집 시작 해의 일부 월만 있는 해는 제외)
    YEARS = Array.from(new Set(MONTHS.map((m) => m.slice(0, 4)))).filter((y) => set.has(y + '-01')).sort().slice(-SHOWN_YEARS);
    TOT = null;
  }

  function getSeries(code) {
    if (code !== 'ALL') return series(code);
    if (TOT) return TOT;
    const out = {};
    MONTHS.forEach((m) => {
      let sum = 0, n = 0;
      CODES.forEach((c) => { const v = series(c)[m]; if (v != null) { sum += v; n++; } });
      if (n) out[m] = sum;
    });
    return (TOT = out);
  }

  const prevYear = (m) => (parseInt(m.slice(0, 4), 10) - 1) + m.slice(4);

  // ---------- 값 계산 ----------
  function monthValue(code, m, mode) {
    const s = getSeries(code);
    if (mode === 'level') return s[m] != null ? s[m] : null;
    if (mode === 'cum') {
      const y = m.slice(0, 4); let sum = 0, any = false;
      for (const k of Object.keys(s)) if (k.slice(0, 4) === y && k <= m) { sum += s[k]; any = true; }
      return any ? sum : null;
    }
    const cur = s[m], prev = s[prevYear(m)];
    if (cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / prev * 100;
  }
  // 올해처럼 일부 월만 있는 해는 "같은 달까지"로 맞춰 비교한다. basis=ytd면 모든 해를 1~N월로 맞춘다.
  function nFor(year, basis) { return (basis === 'ytd' || year === latestYear()) ? latestN() : 12; }
  function annual(code, year, n) {
    const s = getSeries(code);
    if (isStock()) { const v = s[year + '-' + pad2(n)]; return v != null ? v : null; } // 미분양: 해당 달 말 잔량
    let sum = 0;
    for (let i = 1; i <= n; i++) { const v = s[year + '-' + pad2(i)]; if (v == null) return null; sum += v; }
    return sum;
  }
  function yearValue(code, year, mode) {
    const y = parseInt(year, 10), n = nFor(y, state.basis);
    if (mode === 'yoy') {
      const cur = annual(code, y, n), prev = annual(code, y - 1, n);
      return (cur == null || prev == null || prev === 0) ? null : (cur - prev) / prev * 100;
    }
    return annual(code, y, n);
  }
  function valueFor(code, p, mode) {
    return state.unit === 'year' ? yearValue(code, p, mode === 'cum' ? 'level' : mode) : monthValue(code, p, mode);
  }
  function yearLabel(y, withBasis) {
    const n = nFor(parseInt(y, 10), state.basis);
    if (n === 12) return isStock() ? y + '년 말' : y + '년';
    return isStock() ? y + '년 ' + n + '월 말' : y + '년 1~' + n + '월';
  }
  const periodLabel = (p) => state.unit === 'year' ? yearLabel(p) : monthText(p);
  const modeText = () => ({
    level: state.unit === 'year' ? (isStock() ? '연말 잔량' : '연간 합계') : (isStock() ? '월말 잔량' : '월 수치'),
    cum: '연초 누계',
    yoy: state.unit === 'year' ? '전년 대비' : '전년 동월 대비'
  })[state.mode];

  // ---------- 지도 ----------
  const svg = d3.select('#map');
  let paths, labels, projection, pathGen;
  function drawMap() {
    // 울릉도·독도·작은 섬은 지도를 작게 만들 뿐이라 덜어낸다(제주는 유지).
    GEO.features.forEach((f) => {
      if (f.geometry.type === 'MultiPolygon')
        f.geometry.coordinates = f.geometry.coordinates.filter((c) => d3.geoArea({ type: 'Polygon', coordinates: c }) > 2e-5);
    });
    // 남은 모양의 가로세로 비율에 맞춰 viewBox를 정해 상자를 꽉 채운다.
    projection = d3.geoMercator().fitWidth(588, GEO);
    const bb = d3.geoPath(projection).bounds(GEO);
    projection.translate([projection.translate()[0] + 6 - bb[0][0], projection.translate()[1] + 6 - bb[0][1]]);
    pathGen = d3.geoPath(projection);
    // 제주는 본토와 멀리 떨어져 빈 공간만 늘리므로 남해안 쪽으로 끌어올려 배치한다(위치는 그대로 읽히는 정도로만).
    const jeju = GEO.features.find((f) => f.properties.code === '39');
    const rest = GEO.features.filter((f) => f !== jeju);
    const mainBottom = d3.max(rest, (f) => pathGen.bounds(f)[1][1]);
    const jejuTop = pathGen.bounds(jeju)[0][1];
    const JEJU_DY = Math.max(0, jejuTop - mainBottom - 26);
    svg.attr('viewBox', '0 0 600 ' + Math.ceil(bb[1][1] - bb[0][1] + 34 - JEJU_DY));
    const g = svg.append('g');
    paths = g.selectAll('path').data(GEO.features).join('path')
      .attr('class', 'region').attr('d', pathGen)
      .attr('tabindex', 0)
      .attr('transform', (f) => f.properties.code === '39' ? 'translate(0,' + (-JEJU_DY) + ')' : null)
      .on('mousemove', (e, f) => showTip(e, gcode(f)))
      .on('mouseenter', (e, f) => highlight(gcode(f), true))
      .on('mouseleave', (e, f) => { hideTip(); highlight(gcode(f), false); })
      .on('click', (e, f) => selectRegion(gcode(f)))
      .on('keydown', (e, f) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRegion(gcode(f)); } });
    const lg = svg.append('g');
    // 경기는 서울·인천을 감싸는 모양이라 중심점이 서울과 겹친다 → 라벨 위치를 직접 지정한다.
    const LABEL_AT = { '31': { lonlat: [127.5, 37.3] }, '11': { dx: -70, dy: -38 } };
    // 광주(24)는 전남(36)과 한 덩어리라 라벨은 전남 쪽에 하나만 둔다.
    labels = lg.selectAll('g').data(GEO.features.filter((f) => pathGen.area(f) > 260 && f.properties.code !== '24')).join('g')
      .attr('transform', (f) => {
        const o = LABEL_AT[f.properties.code] || {};
        const c = o.lonlat ? projection(o.lonlat) : pathGen.centroid(f);
        return `translate(${c[0] + (o.dx || 0)},${c[1] + (o.dy || 0) - (f.properties.code === '39' ? JEJU_DY : 0)})`;
      });
    labels.filter((f) => LABEL_AT[f.properties.code] && LABEL_AT[f.properties.code].dx != null)
      .append('line').attr('x1', 0).attr('y1', 4)
      .attr('x2', (f) => -LABEL_AT[f.properties.code].dx).attr('y2', (f) => -LABEL_AT[f.properties.code].dy)
      .attr('stroke', 'var(--muted)').attr('stroke-width', 1);
    labels.append('text').attr('class', 'lbl n').attr('y', -4).text((f) => NAMES[gcode(f)]);
    labels.append('text').attr('class', 'lbl v').attr('y', 13);
  }

  function colorScale(values, mode) {
    if (mode === 'yoy') {
      const m = Math.min(200, Math.max(20, d3.max(values, (v) => Math.abs(v)) || 20));
      const neg = d3.interpolateRgb('#ffd8c2', '#ff5a1f'), pos = d3.interpolateRgb('#cfe0ff', '#1a45e0');
      const f = (v) => v >= 0 ? pos(Math.min(1, v / m)) : neg(Math.min(1, -v / m));
      const color = (v) => v == null ? null : (Math.abs(v) < 0.05 ? '#e6ecf6' : f(v));
      return { color, kind: 'div', max: m };
    }
    const sorted = values.slice().sort(d3.ascending);
    const cs = getComputedStyle(document.documentElement);
    const pal = [0, 1, 2, 3, 4].map((i) => cs.getPropertyValue('--seq' + i).trim());
    const q = d3.scaleQuantile().domain(sorted).range(pal);
    return { color: (v) => v == null ? null : q(v), kind: 'seq', thresholds: q.quantiles(), pal, min: sorted[0], max: sorted[sorted.length - 1] };
  }

  function render() {
    const p = periods()[state.idx];
    const last = Math.max(1, periods().length - 1);
    $('slider').style.setProperty('--p', (state.idx / last * 100) + '%');
    $('monthLabel').textContent = p ? periodLabel(p) : '–';
    const hasData = MONTHS.length > 0;
    $('empty').classList.toggle('on', !hasData);
    if (!hasData) {
      paths.attr('fill', 'var(--empty)'); labels.select('.v').text(''); $('legend').innerHTML = '';
      renderPanel(null); renderTrend(); return;
    }
    const vals = CODES.map((c) => valueFor(c, p, state.mode)).filter((v) => v != null);
    const sc = colorScale(vals, state.mode);
    paths.attr('fill', (f) => sc.color(valueFor(gcode(f), p, state.mode)) || 'var(--empty)');
    labels.select('.v').text((f) => { const v = valueFor(gcode(f), p, state.mode);
      return v == null ? '' : (state.mode === 'yoy' ? fmtPct(v) : fmtShort(v)); });
    renderLegend(sc);
    renderPanel(p);
    renderTrend();
  }

  function renderLegend(sc) {
    const el = $('legend'); el.innerHTML = '';
    const unit = state.mode === 'yoy' ? '%' : metricDef().unit;
    if (sc.kind === 'seq') {
      const edges = [sc.min].concat(sc.thresholds, [sc.max]);
      sc.pal.forEach((c) => {
        const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = c; el.appendChild(sw);
      });
      const t = document.createElement('span');
      t.textContent = ' ' + fmt(edges[0]) + ' ~ ' + fmt(edges[edges.length - 1]) + unit + ' (5분위)';
      el.appendChild(t);
    } else {
      const g = document.createElement('span'); g.className = 'grad';
      g.style.background = 'linear-gradient(90deg,#ff5a1f,#ffd8c2 40%,#e6ecf6 50%,#cfe0ff 60%,#1a45e0)';
      el.append('−' + sc.max.toFixed(0) + '%', g, '+' + sc.max.toFixed(0) + '%');
      const n = document.createElement('span'); n.textContent = ' (범위 밖은 같은 색)'; el.appendChild(n);
    }
  }

  function renderPanel(p) {
    const def = metricDef();
    const sel = state.selected;
    $('sumLab').textContent = (sel ? NAMES[sel] : '전국 합계') + ' · ' + def.label + ' · ' + modeText();
    const rows = CODES.map((c) => ({ c, v: p ? valueFor(c, p, state.mode) : null }));
    rows.sort((a, b) => (b.v == null) - (a.v == null) || b.v - a.v);
    const key = sel || 'ALL';
    const cur = p ? valueFor(key, p, state.mode) : null;
    $('sumBig').innerHTML = state.mode === 'yoy' ? fmtPct(cur) : fmt(cur) + '<small>' + def.unit + '</small>';
    const y = p ? valueFor(key, p, 'yoy') : null;
    const yel = $('sumYoy');
    if (state.mode === 'yoy' || y == null) { yel.textContent = ''; yel.className = 'yoy'; }
    else { yel.textContent = (state.unit === 'year' ? '전년보다 ' : '1년 전보다 ') + fmtPct(Math.abs(y)).replace('+', '') + (y >= 0 ? ' 늘었어요' : ' 줄었어요'); yel.className = 'yoy ' + (y >= 0 ? 'up' : 'down'); }

    const maxAbs = d3.max(rows, (r) => r.v == null ? 0 : Math.abs(r.v)) || 1;
    const ul = $('rank'); ul.innerHTML = '';
    rows.forEach((r) => {
      const li = document.createElement('li'); li.dataset.code = r.c;
      if (r.c === sel) li.classList.add('hl');
      const w = r.v == null ? 0 : Math.max(1, Math.abs(r.v) / maxAbs * 100);
      li.innerHTML = '<span>' + NAMES[r.c] + '</span><span class="bar"><i class="' + (r.v < 0 ? 'neg' : '') +
        '" style="width:' + w + '%"></i></span><span class="val">' + (state.mode === 'yoy' ? fmtPct(r.v) : fmt(r.v)) + '</span>';
      li.addEventListener('mouseenter', () => highlight(r.c, true));
      li.addEventListener('mouseleave', () => highlight(r.c, false));
      li.addEventListener('click', () => selectRegion(r.c));
      ul.appendChild(li);
    });
    renderSpark(key);
    const parts = [];
    if (state.unit === 'month') {
      parts.push(isStock() ? '미분양은 월말 잔량(스톡) 지표라 연초 누계를 제공하지 않습니다.'
        : '연초 누계는 해당 연도 1월부터 선택 월까지 수집된 월 값의 합입니다.');
    } else {
      parts.push(isStock() ? '연도별 보기의 미분양은 해당 연도 말(올해는 최근 월 말) 잔량입니다.'
        : '연도별 보기는 1~12월 합계이며, 올해처럼 일부만 집계된 해는 같은 달까지로 전년과 비교합니다.');
    }
    if (def.note) parts.push(def.note);
    parts.push('광주·전남은 국토부가 합쳐서 공표하는 방식에 맞춰 전남광주로 묶었습니다.');
    $('note').textContent = parts.join(' ');
  }

  function renderSpark(key) {
    const s = d3.select('#spark'); s.selectAll('*').remove();
    if (!MONTHS.length) return;
    let pts;
    if (state.unit === 'year') {
      pts = YEARS.slice(0, state.idx + 1).map((yy, i) => ({ i, v: yearValue(key, yy, 'level') }));
    } else {
      const lo = Math.max(0, state.idx - 23);
      pts = MONTHS.slice(lo, state.idx + 1).map((mm, i) => ({ i, v: monthValue(key, mm, 'level') }));
    }
    const ok = pts.filter((p) => p.v != null);
    if (ok.length < 2) return;
    const x = d3.scaleLinear([0, Math.max(1, pts.length - 1)], [4, 296]);
    const y = d3.scaleLinear(d3.extent(ok, (p) => p.v), [62, 8]);
    s.append('path').attr('d', d3.line().x((p) => x(p.i)).y((p) => y(p.v))(ok))
      .attr('fill', 'none').attr('stroke', 'var(--accent)').attr('stroke-width', 2).attr('vector-effect', 'non-scaling-stroke');
    const last = ok[ok.length - 1];
    s.append('circle').attr('cx', x(last.i)).attr('cy', y(last.v)).attr('r', 3.5).attr('fill', 'var(--accent)');
  }

  // ---------- 연도별 추이 ----------
  function currentYear() {
    const p = periods()[state.idx];
    return p ? parseInt(String(p).slice(0, 4), 10) : null;
  }
  function renderTrend() {
    const def = metricDef(), key = state.selected || 'ALL';
    const bars = d3.select('#bars'); bars.selectAll('*').remove();
    const mult = $('multiples'); mult.innerHTML = '';
    $('trendTitle').textContent = (state.selected ? NAMES[state.selected] : '전국') + ' · ' + def.label + ' · 연도별 추이';
    if (!MONTHS.length || !YEARS.length) { $('trendSub').textContent = ''; $('trendNote').textContent = ''; return; }

    const N = latestN(), LY = latestYear(), stock = isStock();
    const bf = document.querySelector('#basis [data-basis="full"]'), by = document.querySelector('#basis [data-basis="ytd"]');
    bf.textContent = stock ? '연말 잔량' : '연간';
    by.textContent = N === 12 ? (stock ? '12월 말 기준' : '1~12월') : (stock ? N + '월 말 기준' : '동기간 1~' + N + '월');
    document.querySelectorAll('#basis .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.basis === state.basis));
    $('trendSub').textContent = state.basis === 'ytd'
      ? '모든 해를 ' + (stock ? N + '월 말' : '1~' + N + '월') + '로 맞춰 비교'
      : (stock ? '매년 12월 말 잔량 (올해는 ' + N + '월 말)' : '매년 1~12월 합계' + (N < 12 ? ' (' + LY + '년은 1~' + N + '월)' : ''));

    const cy = currentYear();
    const data = YEARS.map((yy) => ({
      y: yy, v: yearValue(key, yy, 'level'), g: yearValue(key, yy, 'yoy'),
      partial: nFor(parseInt(yy, 10), state.basis) < 12
    }));
    const dense = YEARS.length > 12; // 막대가 많으면 라벨을 줄여 겹침을 막는다
    const W = 700, top = 34, base = 188, left = 44;
    const band = d3.scaleBand(YEARS, [left, W - 12]).padding(0.3);
    const mx = d3.max(data, (d) => d.v) || 1;
    const yS = d3.scaleLinear([0, mx], [base, top]).nice();
    const ticks = yS.ticks(4);
    const defs = bars.append('defs');
    const mk = (id, c1, c2) => { const g = defs.append('linearGradient').attr('id', id).attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 1);
      g.append('stop').attr('offset', '0%').attr('stop-color', c1); g.append('stop').attr('offset', '100%').attr('stop-color', c2); };
    mk('gHi', 'var(--bar-hi2)', 'var(--bar-hi)'); mk('gLo', 'var(--bar-top)', 'var(--bar)');
    ticks.forEach((t) => {
      bars.append('line').attr('class', 'gl').attr('x1', left).attr('x2', W - 8).attr('y1', yS(t)).attr('y2', yS(t));
      bars.append('text').attr('class', 'gt').attr('x', left - 8).attr('y', yS(t) + 4).text(t === 0 ? '0' : fmtShort(t));
    });
    const gs = bars.selectAll('g.yr').data(data).join('g').attr('class', 'yr');
    gs.append('rect').attr('class', 'bar')
      .attr('x', (d) => band(d.y)).attr('width', band.bandwidth())
      .attr('y', (d) => d.v == null ? base : yS(d.v)).attr('height', (d) => d.v == null ? 0 : base - yS(d.v))
      .attr('rx', dense ? 5 : 10)
      .attr('fill', (d) => parseInt(d.y, 10) === cy ? 'url(#gHi)' : 'url(#gLo)')
      .attr('opacity', (d) => d.partial ? 0.78 : 1)
      .on('click', (e, d) => setUnit('year', d.y))
      .append('title').text((d) => yearLabel(d.y) + ': ' + fmt(d.v) + def.unit + (d.g != null ? ' (전년 대비 ' + fmtPct(d.g) + ')' : ''));
    gs.append('text').attr('class', 'tv').attr('x', (d) => band(d.y) + band.bandwidth() / 2)
      .style('font-size', dense ? '10px' : null).attr('y', (d) => (d.v == null ? base : yS(d.v)) - 8).text((d) => d.v == null ? '' : (dense ? fmtShort(d.v) : fmt(d.v)));
    gs.append('text').attr('class', 'tx').attr('x', (d) => band(d.y) + band.bandwidth() / 2).attr('y', base + 18)
      .style('font-weight', (d) => parseInt(d.y, 10) === cy ? 700 : 400).style('fill', (d) => parseInt(d.y, 10) === cy ? 'var(--ink)' : null)
      .style('font-size', dense ? '10px' : null).text((d) => (dense ? "'" + d.y.slice(2) : d.y) + (d.partial ? (stock ? '(' + N + '월)' : '(~' + N + '월)') : ''));
    gs.filter((d) => d.g != null).append('rect').attr('class', (d) => 'chip ' + (d.g >= 0 ? 'up' : 'down')).attr('rx', 9)
      .attr('x', (d) => band(d.y) + band.bandwidth() / 2 - (dense ? 15 : 34)).attr('y', base + 28).attr('width', dense ? 30 : 68).attr('height', 20);
    gs.append('text').attr('class', (d) => 'tg ' + (d.g == null ? 'na' : (d.g >= 0 ? 'up' : 'down')))
      .attr('x', (d) => band(d.y) + band.bandwidth() / 2).attr('y', base + 42)
      .style('font-size', dense ? '9px' : null).text((d) => d.g == null ? '–' : (dense ? (d.g >= 0 ? '▲' : '▼') + Math.round(Math.abs(d.g)) : (d.g >= 0 ? '▲ ' : '▼ ') + fmtPct(Math.abs(d.g)).replace('+', '')));

    // 시도별 한눈에: 최신 연도 값 기준 내림차순
    const latestY = YEARS[YEARS.length - 1];
    const cells = CODES.map((c) => ({ c, last: yearValue(c, latestY, 'level'), g: yearValue(c, latestY, 'yoy') }))
      .sort((a, b) => (b.last == null) - (a.last == null) || b.last - a.last);
    cells.forEach((cell) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mini' + (cell.c === state.selected ? ' sel' : '');
      b.setAttribute('aria-label', NAMES[cell.c] + ' ' + def.label + ' 연도별 추이');
      b.innerHTML = '<div class="n"><span>' + NAMES[cell.c] + '</span><span class="g ' + (cell.g == null ? '' : (cell.g >= 0 ? 'up' : 'down')) + '">' +
        (cell.g == null ? '' : (cell.g >= 0 ? '▲' : '▼') + fmtPct(Math.abs(cell.g)).replace('+', '')) + '</span></div><div class="v">' + fmt(cell.last) + '</div><svg viewBox="0 0 120 44" preserveAspectRatio="none"></svg>';
      b.addEventListener('click', () => selectRegion(cell.c));
      mult.appendChild(b);
      const vals = YEARS.map((yy) => ({ y: yy, v: yearValue(cell.c, yy, 'level') }));
      const m2 = d3.max(vals, (d) => d.v) || 1;
      const bx = d3.scaleBand(YEARS, [2, 118]).padding(0.2);
      d3.select(b.querySelector('svg')).selectAll('rect').data(vals).join('rect')
        .attr('x', (d) => bx(d.y)).attr('width', bx.bandwidth())
        .attr('y', (d) => d.v == null ? 43 : 43 - (d.v / m2) * 40).attr('height', (d) => d.v == null ? 0 : Math.max(1, (d.v / m2) * 40))
        .attr('rx', 3).attr('fill', (d) => d.y === latestY ? 'var(--bar-hi)' : 'var(--bar)');
    });

    const notes = [];
    if (stock) notes.push('미분양은 월말 잔량이라 연말(또는 같은 달 말) 값을 비교합니다.');
    else if (state.basis === 'full' && N < 12) notes.push(LY + '년은 1~' + N + '월만 집계돼 연한 막대로 표시했고, 전년 대비는 같은 기간끼리 계산했습니다. ‘동기간 비교’를 켜면 모든 해를 1~' + N + '월로 맞춥니다.');
    else if (state.basis === 'ytd') notes.push('모든 해를 1~' + N + '월 합계로 맞춘 비교입니다.');
    notes.push('막대를 누르면 지도가 그 연도의 연도별 보기로 바뀝니다. 시도 카드를 누르면 위 그래프가 그 지역으로 바뀝니다.');
    $('trendNote').textContent = notes.join(' ');
  }

  function highlight(code, on) {
    paths.classed('hl', (f) => on && gcode(f) === code);
    document.querySelectorAll('#rank li').forEach((li) => li.classList.toggle('hl', (on && li.dataset.code === code) || li.dataset.code === state.selected));
  }
  function selectRegion(code) {
    state.selected = state.selected === code ? null : code;
    paths.classed('sel', (f) => gcode(f) === state.selected);
    render();
  }

  const tip = $('tip');
  function showTip(e, code) {
    const p = periods()[state.idx]; if (!p) return;
    const v = valueFor(code, p, state.mode), y = valueFor(code, p, 'yoy');
    tip.innerHTML = '<b>' + NAMES[code] + '</b>' + (state.mode === 'yoy' ? fmtPct(v) : fmt(v) + metricDef().unit) +
      (state.mode !== 'yoy' && y != null ? '<br>' + (state.unit === 'year' ? '전년 대비 ' : '전년 동월 대비 ') + fmtPct(y) : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - 230, e.clientX + 14) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }

  // ---------- 컨트롤 ----------
  function syncControls() {
    const sl = $('slider'); sl.max = Math.max(0, periods().length - 1); sl.value = state.idx;
    document.querySelectorAll('#units .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.unit === state.unit));
    const yearly = state.unit === 'year';
    const lvl = document.querySelector('[data-mode="level"]'), cum = document.querySelector('[data-mode="cum"]'), yoy = document.querySelector('[data-mode="yoy"]');
    lvl.textContent = yearly ? (isStock() ? '연말 잔량' : '연간 합계') : (isStock() ? '월말 잔량' : '월 수치');
    yoy.textContent = yearly ? '전년 대비' : '전년 동월 대비';
    cum.disabled = isStock() || yearly;
    if (cum.disabled && state.mode === 'cum') state.mode = 'level';
    document.querySelectorAll('#modes .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
    document.querySelectorAll('#metrics .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === state.metric));
  }
  function setMetric(id, keepPos) {
    const prevP = keepPos ? periods()[state.idx] : null;
    state.metric = id; buildPeriods();
    const list = periods();
    let i = prevP ? list.indexOf(prevP) : -1;
    state.idx = i >= 0 ? i : Math.max(0, list.length - 1);
    syncControls(); render();
  }
  function setMode(mode) { state.mode = mode; syncControls(); render(); }
  function setUnit(unit, yearArg) {
    stop();
    const curYear = currentYear();
    if (unit === 'year') {
      const target = String(yearArg || curYear || YEARS[YEARS.length - 1]);
      state.unit = 'year';
      const i = YEARS.indexOf(target);
      state.idx = i >= 0 ? i : Math.max(0, YEARS.length - 1);
    } else {
      state.unit = 'month';
      const target = String(yearArg || curYear);
      let last = -1;
      MONTHS.forEach((m, i) => { if (m.slice(0, 4) === target) last = i; });
      state.idx = last >= 0 ? last : Math.max(0, MONTHS.length - 1);
    }
    syncControls(); render();
    if (yearArg) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  function setBasis(b) { state.basis = b; render(); }
  function togglePlay() {
    if (state.playing) { stop(); return; }
    const n = periods().length; if (!n) return;
    if (state.idx >= n - 1) state.idx = 0;
    state.playing = true; $('play').textContent = '❚❚';
    timer = setInterval(() => {
      if (state.idx >= periods().length - 1) { stop(); return; }
      state.idx++; $('slider').value = state.idx; render();
    }, state.unit === 'year' ? 1100 : 650);
  }
  function stop() { clearInterval(timer); state.playing = false; $('play').textContent = '▶'; }

  async function init() {
    [META, GEO] = await Promise.all([
      fetch('data/housing.json', { cache: 'no-cache' }).then((r) => r.json()),
      fetch('data/provinces.geo.json').then((r) => r.json())]);
    DATA = META.data || {};
    $('srcLine').textContent = '출처: ' + META.source + (META.latest ? ' · 최신 ' + monthText(META.latest) : '');
    const box = $('metrics');
    META.metrics.forEach((m) => {
      const b = document.createElement('button'); b.className = 'btn'; b.dataset.id = m.id; b.innerHTML = '<span class="em">' + (EMOJI[m.id] || '📊') + '</span>' + m.label;
      b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => { stop(); setMetric(m.id, true); }); box.appendChild(b);
    });
    document.querySelectorAll('#modes .btn').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
    document.querySelectorAll('#units .btn').forEach((b) => b.addEventListener('click', () => setUnit(b.dataset.unit)));
    document.querySelectorAll('#basis .btn').forEach((b) => b.addEventListener('click', () => setBasis(b.dataset.basis)));
    $('slider').addEventListener('input', (e) => { stop(); state.idx = +e.target.value; render(); });
    $('play').addEventListener('click', togglePlay);
    drawMap();
    setMetric(META.metrics[0].id, false);
  }
  init().catch((e) => { document.querySelector('.sub').textContent = '데이터를 불러오지 못했습니다: ' + e.message; });
})();
</script>
</body>
</html>
