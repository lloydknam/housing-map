name: Probe KOSIS tables

on:
  push:
    paths:
      - scripts/probe_kosis.py
      - .github/workflows/probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe tables
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python3 scripts/probe_kosis.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_probe.json
          git diff --cached --quiet || { git commit -m "data: kosis probe result" && git pull --rebase -q && git push; }
