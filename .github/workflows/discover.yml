name: Discover KOSIS tables

on:
  push:
    paths:
      - scripts/discover_kosis.py
      - .github/workflows/discover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search KOSIS tables
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python3 scripts/discover_kosis.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_discovery.json
          git diff --cached --quiet || { git commit -m "data: kosis discovery result" && git push; }
