name: Probe KOSIS macro tables

on:
  push:
    paths:
      - scripts/discover_macro.py
      - scripts/probe_macro.py
      - .github/workflows/discover.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search KOSIS tables
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python3 scripts/discover_macro.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_discovery_macro.json
          git diff --cached --quiet || { git commit -m "data: kosis macro discovery" && git pull --rebase -q && git push; }
