name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - data/provinces.geo.json
      - data/housing.json
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Update housing data"]   # 데이터 갱신 커밋은 push 이벤트를 만들지 않으므로 완료 시점에 다시 배포
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          mkdir _site/data
          cp data/provinces.geo.json data/housing.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
